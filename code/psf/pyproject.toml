[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "psfselect"
version = "0.1.0"
description = "PSF estimation and model selection for 3D fluorescence microscopy (zebrafish cardiac)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "tifffile>=2023.1",
    "matplotlib>=3.4",
    "pyyaml>=5.4",
    "tabulate>=0.9",        # pandas.to_markdown
    "psfmodels>=0.3.0",     # fallback theoretical PSF backend (no Java needed)
]

[project.optional-dependencies]
test = ["pytest>=6.2"]
viz = ["napari[all]>=0.4.18"]   # for the `psfselect view` 3-window napari display

[project.scripts]
psfselect = "psfselect.cli:main"

[tool.setuptools]
packages = ["psfselect"]
